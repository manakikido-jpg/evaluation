services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sakura
      POSTGRES_PASSWORD: sakura
      POSTGRES_DB: sakuranomiya
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakura -d sakuranomiya"]
      interval: 5s
      retries: 10

  # 朱印 BOT
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config/guild.json:/app/config/guild.json:ro

  # 管理画面（社務所 Web）
  web:
    build: .
    command: ["node", "dist/web/index.js"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config/guild.json:/app/config/guild.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.WEB_PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s

  # ロールとチャンネルを自動で作る（必要なときだけ実行）
  #   docker compose run --rm setup --guild <サーバー ID> [--minimal] [--dry-run]
  setup:
    build: .
    profiles: ["setup"]
    entrypoint: ["node", "dist/scripts/setup-guild.js"]
    env_file: .env
    volumes:
      - ./config:/app/config

  # HTTPS（証明書を自動で取得・更新）
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SHAMUSHO_DOMAIN: ${SHAMUSHO_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
